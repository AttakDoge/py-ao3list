[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ao3list"
version = "0.0.1"
authors = [
    {name = "AttakDoge"}
]
description = "A work metadata scraper cli/tui for AO3"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English"
]

[project.urls]
Homepage = "https://github.com/AttakDoge/py-ao3list"
Issues = "https://github.com/AttakDoge/py-ao3list/issues"

[tool.setuptools.package-data]
"" = ["*.json"]
